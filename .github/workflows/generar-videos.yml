# Genera series de videos en los servidores de GitHub (gratis en repos públicos)
# y los publica como una Release descargable.
#
# Dos formas de usarlo:
#   1) Issues → New issue → "🎬 Generar videos" → elegir opciones → Submit (también desde el móvil).
#      Al terminar se comenta en el Issue el enlace de descarga y se cierra.
#   2) Actions → "Generar videos" → "Run workflow".
name: Generar videos

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      categoria:
        description: "Categoría de la serie"
        type: choice
        default: animales
        options: [animales, colores, numeros, formas, emociones, hablar, comida, vehiculos, cuerpo, naturaleza, mixta]
      cantidad:
        description: "Número de videos (temas) de la serie (1-20)"
        type: string
        default: "5"
      formatos:
        description: "Formatos"
        type: choice
        default: "largo short"
        options: ["largo short", "largo", "short"]
      idiomas:
        description: "Idiomas (doblaje)"
        type: choice
        default: "es en"
        options: ["es en", "es", "en"]
      resolucion:
        description: "Resolución de los videos largos"
        type: choice
        default: "1080p"
        options: ["1080p", "720p"]
      nombre:
        description: "Nombre de la serie (vacío = automático)"
        type: string
        default: ""
      forzar:
        description: "Exportar aunque falle el control de calidad"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: generar-videos-${{ github.event.issue.number || github.run_id }}

jobs:
  plan:
    name: Planificar serie
    # Solo el dueño del repositorio (o colaboradores) puede lanzar videos desde un Issue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((contains(github.event.issue.labels.*.name, 'generar-videos') ||
        startsWith(github.event.issue.title, '🎬 Generar videos')) &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    outputs:
      numeros: ${{ steps.plan.outputs.numeros }}
      nombre: ${{ steps.plan.outputs.nombre }}
      carpeta: ${{ steps.plan.outputs.carpeta }}
      categoria: ${{ steps.plan.outputs.categoria }}
      cantidad: ${{ steps.plan.outputs.cantidad }}
      formatos: ${{ steps.plan.outputs.formatos }}
      idiomas: ${{ steps.plan.outputs.idiomas }}
      resolucion: ${{ steps.plan.outputs.resolucion }}
      forzar: ${{ steps.plan.outputs.forzar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: plan
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          IN_CATEGORIA: ${{ inputs.categoria }}
          IN_CANTIDAD: ${{ inputs.cantidad }}
          IN_FORMATOS: ${{ inputs.formatos }}
          IN_IDIOMAS: ${{ inputs.idiomas }}
          IN_RESOLUCION: ${{ inputs.resolucion }}
          IN_NOMBRE: ${{ inputs.nombre }}
          IN_FORZAR: ${{ inputs.forzar }}
        run: python -S .github/scripts/plan_serie.py
      - name: Avisar en el Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NOMBRE: ${{ steps.plan.outputs.nombre }}
        run: |
          gh label create generar-videos --repo ${{ github.repository }} --color FF595E \
            --description "Pedido de generación de videos" --force || true
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label generar-videos || true
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body \
            "⏳ Generando **$NOMBRE** (${{ steps.plan.outputs.formatos }} · ${{ steps.plan.outputs.idiomas }} · ${{ steps.plan.outputs.resolucion }}). Tarda unos 15 minutos. Progreso: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  video:
    name: Video ${{ matrix.numero }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        numero: ${{ fromJson(needs.plan.outputs.numeros) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Fuentes (texto y emojis)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core fonts-noto-color-emoji
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Producir video ${{ matrix.numero }} (${{ needs.plan.outputs.formatos }} · ${{ needs.plan.outputs.idiomas }})
        env:
          NOMBRE: ${{ needs.plan.outputs.nombre }}
        run: |
          python cli.py serie "${{ needs.plan.outputs.categoria }}" -n "${{ needs.plan.outputs.cantidad }}" \
            --solo ${{ matrix.numero }} --nombre "$NOMBRE" \
            --formatos ${{ needs.plan.outputs.formatos }} --idiomas ${{ needs.plan.outputs.idiomas }} \
            --resolucion "${{ needs.plan.outputs.resolucion }}" --preset medium ${{ needs.plan.outputs.forzar }}
      - name: Subir resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.numero }}
          path: salida/${{ needs.plan.outputs.carpeta }}
          retention-days: 7
          if-no-files-found: warn

  publicar:
    name: Publicar Release
    needs: [plan, video]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Reunir las partes
        uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          merge-multiple: true
          path: salida/${{ needs.plan.outputs.carpeta }}
      - name: Resumen de la serie
        env:
          NOMBRE: ${{ needs.plan.outputs.nombre }}
          CARPETA: ${{ needs.plan.outputs.carpeta }}
        run: |
          python cli.py consolidar "salida/$CARPETA" --nombre "$NOMBRE"
          cat "salida/$CARPETA/resumen_serie.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preparar archivos
        env:
          CARPETA: ${{ needs.plan.outputs.carpeta }}
        run: |
          mkdir -p dist
          raiz="salida/$CARPETA"
          # cada video: .mp4 y miniatura .jpg sueltos + .zip con todo (descripción, timestamps, srt, guion, calidad)
          for d in "$raiz"/*/*/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            cp "$d"/*.mp4 "$d"/*.jpg dist/ 2>/dev/null || true
            (cd "$d" && zip -q -r "$GITHUB_WORKSPACE/dist/${n}.zip" .)
          done
          cp "$raiz/resumen_serie.md" "$raiz/LEEME_MADE_FOR_KIDS.txt" dist/
          ls -la dist
          echo "ARCHIVOS=$(ls dist | wc -l)" >> "$GITHUB_ENV"
      - name: Serie completa (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.carpeta }}
          path: salida/${{ needs.plan.outputs.carpeta }}
          retention-days: 30
      - name: Crear Release
        if: ${{ env.ARCHIVOS != '2' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOMBRE: ${{ needs.plan.outputs.nombre }}
          CARPETA: ${{ needs.plan.outputs.carpeta }}
        run: |
          etiqueta="videos-${{ github.run_number }}"
          gh release create "$etiqueta" dist/* \
            --target "${{ github.sha }}" \
            --title "🎈 $NOMBRE (#${{ github.run_number }})" \
            --notes-file "salida/$CARPETA/resumen_serie.md"
          url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$etiqueta"
          echo "### 📦 Descarga: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "URL_RELEASE=$url" >> "$GITHUB_ENV"
      - name: Responder en el Issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CARPETA: ${{ needs.plan.outputs.carpeta }}
        run: |
          n=${{ github.event.issue.number }}
          if [ -n "$URL_RELEASE" ]; then
            {
              echo "✅ ¡Videos listos! 📦 **Descárgalos aquí:** $URL_RELEASE"
              echo
              cat "salida/$CARPETA/resumen_serie.md" 2>/dev/null | sed -n '1,40p'
            } > comentario.md
            gh issue comment "$n" --repo ${{ github.repository }} --body-file comentario.md
            gh issue close "$n" --repo ${{ github.repository }} --reason completed
          else
            gh issue comment "$n" --repo ${{ github.repository }} --body \
              "❌ No se pudo generar la serie. Detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
