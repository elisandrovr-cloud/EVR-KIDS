name: "🎬 Generar videos"
description: "Genera una serie de videos infantiles en la nube. Al terminar recibirás aquí el enlace de descarga."
title: "🎬 Generar videos"
labels: ["generar-videos"]
body:
  - type: markdown
    attributes:
      value: |
        Elige las opciones y pulsa **Submit new issue** (Crear). Los videos se generan solos en los
        servidores de GitHub (≈ 15 min) y aquí aparecerá un comentario con el enlace para descargarlos.
  - type: dropdown
    id: categoria
    attributes:
      label: Categoría
      options: [animales, colores, numeros, formas, emociones, hablar, comida, vehiculos, cuerpo, naturaleza, mixta]
      default: 0
    validations:
      required: true
  - type: dropdown
    id: cantidad
    attributes:
      label: Número de videos
      options: ["1", "3", "5", "10", "15", "20"]
      default: 2
    validations:
      required: true
  - type: dropdown
    id: formatos
    attributes:
      label: Formatos
      options: ["largo short", "largo", "short"]
      default: 0
    validations:
      required: true
  - type: dropdown
    id: idiomas
    attributes:
      label: Idiomas
      options: ["es en", "es", "en"]
      default: 0
    validations:
      required: true
  - type: dropdown
    id: resolucion
    attributes:
      label: Resolución
      options: ["1080p", "720p"]
      default: 0
    validations:
      required: true
  - type: input
    id: nombre
    attributes:
      label: Nombre de la serie (opcional)
      placeholder: "Serie Animales para Niños"
